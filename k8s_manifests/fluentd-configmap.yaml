apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentd-config
  namespace: kube-system
data:
  fluent.conf: |
    # Collect logs from all containers on the node
    <source>
      @type tail
      path /var/log/containers/*.log
      pos_file /var/log/fluentd-containers.log.pos
      tag kubernetes.*
      read_from_head true
      <parse>
        @type cri
      </parse>
    </source>

    # Enrich logs with Kubernetes metadata (pod name, namespace, labels etc.)
    <filter kubernetes.**>
      @type kubernetes_metadata
    </filter>

    # Only forward logs from student-management namespace
    <filter kubernetes.**>
      @type grep
      <regexp>
        key $.kubernetes.namespace_name
        pattern ^student-management$
      </regexp>
    </filter>

    # Send logs to Elasticsearch on server1
    <match kubernetes.**>
      @type elasticsearch
      host 10.128.0.61
      port 9200
      user fluentd
      password Fluentd@2026
      logstash_format true
      logstash_prefix student-management
      logstash_dateformat %Y.%m.%d
      include_tag_key true
      tag_key @log_name
      flush_interval 5s
      <buffer>
        @type file
        path /var/log/fluentd-buffers/kubernetes.system.buffer
        flush_mode interval
        retry_type exponential_backoff
        flush_interval 5s
        retry_forever false
        retry_max_interval 30
        chunk_limit_size 2M
        queue_limit_length 8
        overflow_action block
      </buffer>
    </match>
